<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio 3D de Design Gráfico - Galeria Virtual</title>
    <!-- Importação do A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Instruções na tela */
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 99;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Estilo do Overlay de Tela Cheia */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 10, 0.92);
            display: none; /* Oculto por padrão */
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #overlay.active {
            display: flex;
            opacity: 1;
        }

        .overlay-content {
            display: flex;
            background: #1e1e1e;
            width: 80%;
            max-width: 900px;
            height: 550px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            border: 1px solid #333;
        }

        .overlay-image-container {
            flex: 1.2;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .overlay-info {
            flex: 1;
            padding: 40px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .overlay-info h2 {
            margin-top: 0;
            color: #18BC9C;
            font-size: 26px;
        }

        .overlay-info .categoria {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 15px;
            display: block;
        }

        .overlay-info p {
            color: #ccc;
            font-size: 15px;
            line-height: 1.6;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #18BC9C;
        }
    </style>
</head>
<body>

    <div id="instructions">
        Use <strong>WASD / Setas</strong> para andar • Clique e arraste para olhar • <strong>Clique na obra</strong> para ver detalhes
    </div>

    <!-- MODO OVERLAY (TELA CHEIA) -->
    <div id="overlay">
        <div class="overlay-content">
            <button class="close-btn" id="closeOverlay">&times;</button>
            <div class="overlay-image-container">
                <img id="modalImg" src="" alt="Obra em destaque">
            </div>
            <div class="overlay-info">
                <div>
                    <span id="modalCategory" class="categoria">Categoria</span>
                    <h2 id="modalTitle">Título da Obra</h2>
                    <p id="modalDesc">Descrição detalhada do projeto de design gráfico aparecerá aqui...</p>
                </div>
                <div style="font-size: 12px; color: #777;">
                    Dica: Pressione ESC ou clique no 'X' para voltar à galeria.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Componente customizado do A-Frame para lidar com cliques nas obras
        AFRAME.registerComponent('clickable-artwork', {
            schema: {
                title: {type: 'string', default: 'Título Padrão'},
                category: {type: 'string', default: 'Design Gráfico'},
                description: {type: 'string', default: 'Descrição do projeto.'},
                imgSrc: {type: 'string', default: ''}
            },
            init: function () {
                var el = this.el;
                var data = this.data;
                var overlay = document.getElementById('overlay');
                var modalImg = document.getElementById('modalImg');
                var modalTitle = document.getElementById('modalTitle');
                var modalCategory = document.getElementById('modalCategory');
                var modalDesc = document.getElementById('modalDesc');
                var rig = document.getElementById('rig');

                el.addEventListener('click', function () {
                    // Preenche os dados no modal
                    modalImg.src = data.imgSrc;
                    modalTitle.textContent = data.title;
                    modalCategory.textContent = data.category;
                    modalDesc.textContent = data.description;

                    // Ativa o overlay e desativa temporariamente o movimento no A-Frame
                    overlay.classList.add('active');
                    if (rig) rig.setAttribute('wasd-controls', 'enabled: false');
                });
            }
        });

        // Função global para fechar o overlay
        function fecharModal() {
            var overlay = document.getElementById('overlay');
            var rig = document.getElementById('rig');
            
            overlay.classList.remove('active');
            if (rig) rig.setAttribute('wasd-controls', 'enabled: true');
        }

        document.getElementById('closeOverlay').addEventListener('click', fecharModal);
        
        // Fecha com a tecla ESC
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                fecharModal();
            }
        });
    </script>

    <a-scene background="color: #ECECEC">

        <!-- ================= ASSETS (Recursos) ================= -->
        <a-assets>
            <img id="obra1" src="https://via.placeholder.com/600x800/2C3E50/FFFFFF?text=Poster+Minimalista" crossorigin="anonymous">
            <img id="obra2" src="https://via.placeholder.com/800x600/18BC9C/FFFFFF?text=Identidade+Visual" crossorigin="anonymous">
            <img id="obra3" src="https://via.placeholder.com/600x800/F39C12/FFFFFF?text=Tipografia+Experimental" crossorigin="anonymous">
            <img id="obra4" src="https://via.placeholder.com/800x600/E74C3C/FFFFFF?text=Design+de+Embalagem" crossorigin="anonymous">
        </a-assets>

        <!-- ================= CÂMERA E CONTROLES ================= -->
        <a-entity id="rig" position="0 0 4">
            <a-camera look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 20">
                <!-- Cursor central para interagir com os quadros -->
                <a-cursor fuse="false" raycaster="objects: .clickable" material="color: #18BC9C; shader: flat" position="0 0 -1" scale="0.6 0.6 0.6"></a-cursor>
            </a-camera>
        </a-entity>

        <!-- ================= ILUMINAÇÃO ================= -->
        <a-entity light="type: ambient; color: #BBB; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-1 3 2"></a-entity>
        <a-entity light="type: point; intensity: 0.7; distance: 10" position="0 3.5 -2"></a-entity>
        <a-entity light="type: point; intensity: 0.7; distance: 10" position="-3.8 3.5 0"></a-entity>
        <a-entity light="type: point; intensity: 0.7; distance: 10" position="3.8 3.5 0"></a-entity>

        <!-- ================= AMBIENTE DA GALERIA ================= -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="16" color="#333333" roughness="0.2"></a-plane>
        <a-plane position="0 5 0" rotation="90 0 0" width="12" height="16" color="#FAFAFA"></a-plane>
        <a-box position="0 2.5 -8" width="12" height="5" depth="0.2" color="#EAEAEA"></a-box>
        <a-box position="-6 2.5 0" width="0.2" height="5" depth="16" color="#E2E2E2"></a-box>
        <a-box position="6 2.5 0" width="0.2" height="5" depth="16" color="#E2E2E2"></a-box>

        <!-- ================= OBRAS DE ARTE INTERATIVAS ================= -->

        <!-- Quadro 1 -->
        <a-entity position="-2 2.5 -7.89">
            <a-box width="2.2" height="2.8" depth="0.05" color="#111111"></a-box>
            <a-plane src="#obra1" width="2" height="2.6" position="0 0 0.03" class="clickable"
                clickable-artwork="title: Pôster Minimalista Geo; category: Cartaz / Impressos; description: Um estudo focado em grids modulares e paleta monocromática explorando profundidade através de formas geométricas simples.; imgSrc: https://via.placeholder.com/600x800/2C3E50/FFFFFF?text=Poster+Minimalista">
            </a-plane>
        </a-entity>

        <!-- Quadro 2 -->
        <a-entity position="2 2.5 -7.89">
            <a-box width="2.8" height="2.2" depth="0.05" color="#111111"></a-box>
            <a-plane src="#obra2" width="2.6" height="2" position="0 0 0.03" class="clickable"
                clickable-artwork="title: Identidade Visual Café Aura; category: Branding / Corporativo; description: Projeto completo de identidade visual desenvolvido para uma marca de café artesanal, englobando manual de marca, paleta de cores e papelaria.; imgSrc: https://via.placeholder.com/800x600/18BC9C/FFFFFF?text=Identidade+Visual">
            </a-plane>
        </a-entity>

        <!-- Quadro 3 -->
        <a-entity position="-5.89 2.5 -2" rotation="0 90 0">
            <a-box width="2.2" height="2.8" depth="0.05" color="#111111"></a-box>
            <a-plane src="#obra3" width="2" height="2.6" position="0 0 0.03" class="clickable"
                clickable-artwork="title: Tipografia Experimental Nexus; category: Tipografia / Type Design; description: Pesquisa tipográfica voltada para títulos de impacto, testando densidade visual e modulações assimétricas nos caracteres.; imgSrc: https://via.placeholder.com/600x800/F39C12/FFFFFF?text=Tipografia+Experimental">
            </a-plane>
        </a-entity>

        <!-- Quadro 4 -->
        <a-entity position="5.89 2.5 -2" rotation="0 -90 0">
            <a-box width="2.8" height="2.2" depth="0.05" color="#111111"></a-box>
            <a-plane src="#obra4" width="2.6" height="2" position="0 0 0.03" class="clickable"
                clickable-artwork="title: Embalagem Linha Botânica; category: Packaging Design; description: Design de embalagem sustentável utilizando papéis texturizados reciclados e tintas à base de água para cosméticos orgânicos.; imgSrc: https://via.placeholder.com/800x600/E74C3C/FFFFFF?text=Design+de+Embalagem">
            </a-plane>
        </a-entity>

        <!-- Banco decorativo -->
        <a-box position="0 0.4 -2" width="2.5" height="0.8" depth="0.8" color="#1A1A1A" roughness="0.4"></a-box>

    </a-scene>

</body>
</html>
